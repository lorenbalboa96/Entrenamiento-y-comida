<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plan 120">
<title>Plan 120 días</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0e12;--fg:#ececf1;--accent:#b48cff;--on:#0b0b0f;--op:.08;--bl:12px;--r:14px;--fs:15px;--ff:"JetBrains Mono",ui-monospace,Menlo,monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit}
html{background:var(--bg) fixed;color:var(--fg);min-height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font:var(--fs)/1.45 var(--ff)}
main{max-width:680px;margin:0 auto;padding:10px 14px 150px}
h2{font-size:1.7em;margin:8px 0}
.card,details{background:rgba(255,255,255,var(--op));backdrop-filter:blur(var(--bl));-webkit-backdrop-filter:blur(var(--bl));border:1px solid rgba(128,128,128,.28);border-radius:var(--r);padding:12px;margin:10px 0}
summary{cursor:pointer}
select,input,textarea,button{font:inherit;color:inherit;background:rgba(128,128,128,.18);border:1px solid rgba(128,128,128,.32);border-radius:calc(var(--r)*.7);padding:9px;max-width:100%}
select{flex:1;min-width:0}
button{background:var(--accent);color:var(--on);border:0;font-weight:600;cursor:pointer}
input[type=range],input[type=color]{width:100%;padding:2px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:8px 0;padding-bottom:2px}
.chip{border-radius:999px;background:rgba(128,128,128,.22);color:var(--fg);padding:9px 14px;white-space:nowrap;font-weight:600}
.chip.on{background:var(--accent);color:var(--on)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.ib{width:36px;height:36px;border-radius:50%;padding:0;background:rgba(128,128,128,.3);color:var(--fg)}
.ck{width:38px;height:38px;border-radius:50%;padding:0;background:transparent;border:2px solid currentColor;color:transparent}
.ck.on{background:var(--accent);border-color:var(--accent);color:var(--on)}
.mut{opacity:.68;font-size:.88em}
.hint{color:var(--accent);font-size:.88em;margin:4px 0}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}td,th{padding:5px 4px;text-align:left}
td input{width:100%;min-width:60px}
.fb{display:flex;gap:6px}.fb button{flex:1;background:rgba(128,128,128,.25);color:var(--fg)}.fb button.on{background:var(--accent);color:var(--on)}
label{display:block;margin:10px 0 2px;font-weight:600}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.th{display:flex;align-items:center;gap:8px;padding:18px 10px;border-radius:var(--r)}
.th i{width:14px;height:14px;border-radius:50%;flex:none}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.st b{font-size:1.4em;display:block}
nav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:660px;margin:0 auto;display:flex;gap:2px;padding:6px;border-radius:24px;background:rgba(40,40,48,.78);color:#fff;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.18)}
nav button{flex:1;background:none;color:#fff;font-size:.68em;padding:6px 0;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button i{font-style:normal;font-size:1.5em}
nav button.on{background:var(--accent);color:var(--on)}
#rt{position:fixed;left:14px;right:14px;bottom:calc(84px + env(safe-area-inset-bottom,0px));max-width:652px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:var(--r);background:rgba(30,30,36,.92);color:#fff;border:1px solid rgba(255,255,255,.2)}
#rt[hidden]{display:none}
</style></head><body>
<main id="v"></main>
<div id="rt" hidden><b>Descanso <span id="rtv"></span></b><span><button data-rt="30">+30″</button> <button data-rt="0">×</button></span></div>
<nav><button data-t="h"><i>📍</i>Hoy</button><button data-t="d"><i>🍎</i>Dieta</button><button data-t="e"><i>🏋️</i>Entreno</button><button data-t="r"><i>⏱️</i>Carrera</button><button data-t="p"><i>📈</i>Progreso</button><button data-t="a"><i>☰</i>Más</button></nav>
<script>
const $=s=>document.querySelector(s);
const st={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let S=Object.assign({start:"",w:0,meals:{},log:{},run:{},prog:[],shop:{},set:{},hist:[],cur:null},st.get("p120",{}));
const save=()=>st.set("p120",S);
const D=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const M={
bat:["Batido de gofio con yogur proteico",650,40,85,15,"400 ml de leche, 50 g de gofio, 1 plátano y 15 g de crema de cacahuete: bátelo la noche anterior. Añade 1 yogur proteico."],
tor:["Tortitas proteicas con fruta y skyr",600,40,70,15,"Avena, claras y 1 huevo en la sartén. Sirve con fruta y skyr."],
ave:["Avena con huevo cocido y fruta",600,35,80,15,"80 g de copos en leche caliente, 1 huevo cocido y 1 fruta."],
sky:["Skyr con nueces",200,20,15,6,"150-200 g de skyr natural y 20 g de nueces."],
pav:["Pavo, fruta y almendras",220,18,20,8,"2 lonchas de pavo, 1 fruta y un puñado de almendras."],
pre:["Plátano, tortitas de arroz y miel",250,6,55,1,"Tómalo 60-90 min antes de entrenar."],
pan:["Pan integral con mermelada",250,7,52,2,"Alternativa de pre-entreno."],
pa:["Pollo con arroz y verdura",760,51,86,20,"200 g de pollo y 100 g de arroz (crudos), 200 g de verdura y 15 g de aceite de oliva."],
pp:["Pavo con pasta integral",740,50,85,18,"200 g de pavo, 120 g de pasta integral y verduras."],
at:["Atún con patata y ensalada",700,50,80,16,"3 latas de atún, 300 g de patata o boniato cocidos y ensalada."],
te:["Ternera magra con arroz",760,48,85,20,"Salteado de ternera con arroz y verduras."],
pb:["Pollo con boniato",720,50,80,18,"200 g de pollo y 300 g de boniato asado."],
me:["Merluza con patata y ensalada",600,40,55,20,"180 g de merluza al horno, 300 g de patata cocida y 10 g de aceite."],
to:["Tortilla de 3 huevos, atún y pan",600,45,40,25,"Tortilla de 3 huevos, 1 lata de atún y pan integral."],
hp:["Huevos, pavo y pan integral",580,45,40,22,"2-3 huevos, 100 g de pavo y pan integral."],
no:["Ñoquis con pollo y salsa de setas",700,48,90,14,"250 g de ñoquis, 150 g de pollo, 150 g de setas, 100 ml de nata ligera y ajo. Dora el pollo, saltea las setas, añade la nata y mezcla con los ñoquis cocidos 2 min."],
la:["Lasaña de carne",720,52,70,22,"3 placas, 150 g de carne magra, 200 g de tomate triturado y 60 g de queso light. Monta capas y hornea 25-30 min a 190 °C. Haz bandeja de 4 raciones."],
pi:["Pizza proteica (air fryer)",760,60,65,25,"2 tortitas de harina, 200 g de carne picada, tomate y 60 g de mozzarella light. 6-8 min a 190 °C."],
wr:["Wrap crujiente de pollo y queso",650,55,60,15,"2 wraps integrales, 160 g de pollo desmenuzado y 40 g de queso light. 5-10 min a 180 °C en air fryer."],
br:["Bowl de arroz",750,55,85,20,"100 g de arroz, 180 g de pollo o ternera, 1 huevo, verduras y ¼ de aguacate."],
bo:["Pasta boloñesa",750,50,90,20,"100 g de pasta, 150 g de carne picada, 200 g de tomate, verduras y 20 g de parmesano."],
cu:["Curry de pollo con arroz",720,50,85,18,"180 g de pollo, 100 g de arroz, 100 ml de leche de coco light, 200 g de verduras y curry."],
ha:["Hamburguesas caseras con patatas",800,55,70,28,"2 hamburguesas de 120 g de ternera o pavo, pan integral, 200 g de patata en air fryer y ensalada. Hamburguesas 15-18 min a 180 °C."],
hb:["Hamburguesas de pollo y brócoli",500,45,15,20,"Pollo picado y brócoli en air fryer. Añade arroz o patata si necesitas más energía."]};
const MAIN=["pa","pp","at","te","pb","me","to","hp","no","la","pi","wr","br","bo","cu","ha","hb"];
const SL=[["Desayuno",["bat","tor","ave"]],["Media mañana",["sky","pav"]],["Almuerzo",MAIN],["Pre-entreno / snack",["pre","pan"]],["Cena",MAIN]];
const DEF=d=>[d==5?"tor":"bat",["sky","pav"][d%2],["pa","pp","at","te","pb","bo","cu"][d],"pre",["me","to","pa","me","hp","pi","la"][d]];
const gm=(d,s)=>S.meals[d+"|"+s]||DEF(d)[s];
const SHOP=["Pechuga de pollo 1 kg","Pavo o ternera magra 600 g","Merluza o pescado blanco 600 g","Atún al natural 6 latas","Huevos 18","Skyr o yogur proteico 14","Leche semi 3 L","Arroz 700 g","Pasta integral 400 g","Patata y boniato 2 kg","Gofio 400 g","Avena 300 g","Pan integral 1","Tortitas de arroz 1 paquete","Plátanos 10-14","Ñoquis, placas de lasaña y tortitas de harina","Carne picada magra 600 g","Aceite de oliva virgen extra","Crema de cacahuete 1 bote","Nueces o almendras 200 g","Verdura variada 2-3 kg","Fruta 7 piezas"];
const W={
A:["Lunes · A",[["Sentadilla trasera","4×6-8"],["Press banca","4×6-8"],["Remo con barra","3×8-10"],["Press militar con mancuernas","3×8-10"],["Curl femoral","3×10-12"],["Curl bíceps","2×10-12"],["Plancha","3×30-45 s"]]],
B:["Miércoles · B",[["Peso muerto rumano","4×6-8"],["Dominadas o jalón","4×8-10"],["Press inclinado con mancuernas","3×8-10"],["Prensa","3×10-12"],["Elevaciones laterales","3×12-15"],["Tríceps en polea","3×10-12"],["Crunch en polea","3×10-12"]]],
C:["Viernes · C",[["Zancadas búlgaras (por pierna)","3×8-10"],["Fondos o press cerrado","3×8-10"],["Remo en polea","3×10-12"],["Hip thrust","3×8-10"],["Face pull","3×12-15"],["Curl martillo","2×10-12"],["Press francés","2×10-12"],["Rueda abdominal / farmer walk","3 series"]]]};
const cur=()=>{if(!S.start)return 1;const w=Math.floor((Date.now()-new Date(S.start))/6048e5)+1;return Math.max(1,Math.min(17,w))};
if(!S.w)S.w=cur();
const wsel=()=>`<select data-wk>${Array.from({length:17},(_,i)=>`<option value=${i+1}${i+1==S.w?" selected":""}>Semana ${i+1}${i+1==cur()?" (actual)":""}</option>`).join("")}</select>`;
function sess(w){if(w<=4)return`${[4,4.5,5,4][w-1]} km suaves (6:00-6:20 por km, aún puedes hablar).`;
if(w<=8)return`10 min suaves + ${[5,6,7,6][w-5]}×(2 min rápido / 2 min suave) + 5 min de enfriamiento.`;
if(w<=12)return`10 min suaves + ${[4,5,5,4][w-9]}×3 min fuertes (5:00-5:20 por km) con 2 min suaves entre medias + 5 min de enfriamiento.`;
if(w<=16)return w%2?`20 min a ritmo cómodo-fuerte, con 10 min de calentamiento y 5 de enfriamiento.`:`10 min suaves + 5×3 min fuertes con 2 min suaves + 5 min de enfriamiento.`;
return"Test de 5 km: calienta 10 min y corre a ritmo fuerte pero sostenible. Apunta el tiempo."}
function vR(){const w=S.w,f=S.run[w]?.fb,L=["Muy fácil","Bien","Duro","Muy duro"],A=["Sube un escalón: +0,5 km o 10 s/km más rápido.","Sigue el plan tal cual.","Repite esta sesión antes de avanzar.","Baja un escalón (menos distancia o más suave) y revisa sueño y comida."];
return`<h2>Running</h2><p class=mut>Una sesión a la semana (martes) para mejorar el cardio y la parte anaeróbica.</p>${wsel()}<div class=card><b>Sesión de la semana ${w}</b><p>${sess(w)}</p><b>¿Cómo fue?</b><div class=fb>${L.map((x,i)=>`<button data-fb=${i+1} class="${f==i+1?"on":""}">${x}</button>`).join("")}</div>${f?`<p><b>Siguiente paso:</b> ${A[f-1]}</p>`:""}</div><div class=card><b>Jueves: estiramientos y meditación (25 min)</b><p class=mut>Caderas, isquios, pectoral y espalda (30-45 s por postura). Cierra con 5-10 min de respiración guiada: inhala 4 s, exhala 6 s.</p></div><div class=card><b>Pasos diarios</b><p class=mut>Semanas 1-4: 6.000-7.000 · 5-8: 7.500-8.500 · 9-17: 8.000-10.000. Levántate 2-3 min cada hora.</p></div>`}
M["-"]=["— nada —",0,0,0,0,""];
const TH={"Océano":["linear-gradient(160deg,#0a1b38,#1c4a8c)","#f2f6ff","#7be6d2",.1,"#06121f","dark"],"Teide":["linear-gradient(160deg,#2a1410,#9a4a2c)","#fff4ea","#ffb86b",.1,"#2a1410","dark"],"Laurisilva":["linear-gradient(160deg,#0d2a17,#3f7a4a)","#effff1","#9be8a6",.1,"#0d2a17","dark"],"Atardecer":["linear-gradient(160deg,#4b1d6b,#a23aa0)","#fff0fb","#ff8fd0",.1,"#3a0f4f","dark"],"Arena":["linear-gradient(160deg,#f7e8d6,#f1d2b4)","#2b2118","#d4571a",.6,"#fff","light"],"Minimal claro":["#f7f7f8","#16181d","#2b5cff",.8,"#fff","light"],"Minimal oscuro":["#0e0e12","#ececf1","#b48cff",.08,"#0b0b0f","dark"],"Alto contraste":["#000","#fff","#ffe600",.14,"#000","dark"]};
const FF={Mono:'"JetBrains Mono",ui-monospace,Menlo,monospace',Sistema:"system-ui,-apple-system,sans-serif",Serif:"Georgia,serif",Redondeada:'"Avenir Next Rounded",system-ui,sans-serif'};
const thn=()=>S.set.th||(matchMedia("(prefers-color-scheme: dark)").matches?"Minimal oscuro":"Minimal claro");
let T="h",DAY=(new Date().getDay()+6)%7,SUB={d:"m",e:"s",p:"p",a:"c"},FL="",Q="",INFO={},RG=9999,RT=0,RI;
const today=()=>new Date().toISOString().slice(0,10);
const ch=(k,l)=>`<div class=chips>${l.map(([v,t])=>`<button class="chip${SUB[k]==v?" on":""}" data-sub="${k}|${v}">${t}</button>`).join("")}</div>`;
function tick(){const e=$("#rt");if(RT<=0){e.hidden=true;clearInterval(RI);return}e.hidden=false;$("#rtv").textContent=Math.floor(RT/60)+":"+String(RT%60).padStart(2,"0");RT--}
function rest(s){RT=s;clearInterval(RI);tick();RI=setInterval(tick,1000)}
const rs=e=>{for(const k in W){const x=W[k][1].find(a=>a[0]==e);if(x){const u=parseInt((x[1].split("×")[1]||"").split("-").pop());return u&&u<=8?150:90}}return 90};
const last=e=>{for(let i=S.hist.length-1;i>=0;i--){const r=(S.hist[i].ex[e]||[]).map(x=>+x[0]).filter(Boolean);if(r.length)return Math.max(...r)}return 0};
const REC=[0,1,2,3].flatMap(i=>SL[i][1].map(id=>[id,i]));
const CAT=["Desayuno","Media mañana","Almuerzo / cena","Pre-entreno"];
function vH(){const n=(new Date().getDay()+6)%7,k={0:"A",2:"B",4:"C"}[n];let t=[0,0];
const l=SL.map(([sn],s)=>{const m=M[gm(n,s)];t[0]+=m[1];t[1]+=m[2];return`<div class=row><span>${sn}: ${m[0]}</span><span class=mut>${m[1]} kcal</span></div>`}).join("");
const txt=k?`${W[k][0]}: ${W[k][1].length} ejercicios`:["","Running (semana "+S.w+")","","Estiramientos y meditación (25 min)","","Batch cooking y paseo largo","Descanso activo"][n]||"Descanso";
return`<h2>Hoy · ${D[n]}</h2><div class=card><b>Entreno</b><p>${txt}</p>${k?`<button data-go="e|s">Ir al entreno</button>`:""}</div><div class=card><b>Comidas de hoy</b>${l}<p><b>${t[0]} kcal · ${t[1]} g de proteína</b></p></div><div class=card><b>Peso de hoy</b><div class=row><input id=wd type=hidden value="${today()}"><input id=wv type=number step=.1 inputmode=decimal placeholder="kg"><button data-a=addw>Guardar</button></div><p class=mut>Pasos: objetivo diario en Carrera. Agua: 2,5-3 L.</p></div>`}
function vD(){const s=SUB.d;let h=`<h2>Dieta</h2>${ch("d",[["m","Menú"],["r","Recetas"],["c","Compra"]])}`;
if(s=="m"){h+=`<div class=chips>${D.map((x,i)=>`<button class="chip${i==DAY?" on":""}" data-day=${i}>${x.slice(0,3)}</button>`).join("")}</div>`;let t=[0,0,0,0];
SL.forEach(([sn,o],i)=>{const id=gm(DAY,i),m=M[id];for(let j=0;j<4;j++)t[j]+=m[j+1];
h+=`<div class=card><div class=mut>${sn}</div><div class=row><select data-m="${DAY}|${i}">${o.concat("-").map(x=>`<option value="${x}"${x==id?" selected":""}>${M[x][0]}</option>`).join("")}</select><button class=ib data-info="${DAY}|${i}">i</button></div><div class=mut>${m[1]} kcal · ${m[2]} P</div>${INFO[DAY+"|"+i]?`<p class=mut>${m[5]}</p>`:""}</div>`});
h+=`<div class=card><b>${t[0]} kcal · ${t[1]} P · ${t[2]} C · ${t[3]} G</b><div class=mut>Objetivo: 2.400-2.600 kcal y 130-160 g de proteína.</div></div>`}
else if(s=="r"){h+=`<div class=chips>${[["","Todas"],...CAT.map((c,i)=>[""+i,c])].map(([v,t])=>`<button class="chip${FL==v?" on":""}" data-fl="${v}">${t}</button>`).join("")}</div><input data-q placeholder="Buscar receta…" value="${Q}" style="width:100%">`;
REC.filter(([id,i])=>(FL===""||+FL==i)&&M[id][0].toLowerCase().includes(Q.toLowerCase())).forEach(([id,i])=>{const m=M[id];h+=`<details><summary><div class=row style="display:inline-flex;width:calc(100% - 20px)"><b>${m[0]}</b><span class=mut>${m[1]} kcal<br>${m[2]} prot</span></div></summary><p class=mut>${CAT[i]} · ${m[3]} C · ${m[4]} G<br>${m[5]}</p></details>`})}
else h+=`<div class=card><div class=row><button data-a=unchk>Desmarcar todo</button></div>${SHOP.map((x,i)=>`<label style="font-weight:400"><input type=checkbox data-sh=${i}${S.shop[i]?" checked":""}> ${x}</label>`).join("")}<p class=mut>Batch cooking el sábado (≈3 h): hornear pollo y pavo, asar verduras y boniato, cocer arroz y pasta, y porcionar 5-6 tuppers.</p></div>`;
return h}
function vE(){let h=`<h2>Entreno</h2>${ch("e",[["s","Sesión"],["h","Historial"]])}`;
if(SUB.e=="h"){h+=S.hist.length?[...S.hist].reverse().map(s=>`<details><summary>${s.d} · ${W[s.k][0]}</summary>${Object.keys(s.ex).map(e=>{const r=s.ex[e].filter(x=>x[0]);return r.length?`<div class=mut>${e}: ${r.map(x=>x[0]+" kg × "+(x[1]||"?")).join(" · ")}</div>`:""}).join("")}</details>`).join(""):`<p class=mut>Aún no hay sesiones. Termina una para ver tu historial.</p>`;
h+=`<details><summary>Progreso por ejercicio</summary><table><tr><th>Ejercicio<th>Inicio<th>Ahora</tr>${Object.values(W).flatMap(w=>w[1]).map(([e])=>{const v=S.hist.map(s=>Math.max(0,...(s.ex[e]||[]).map(x=>+x[0]||0))).filter(Boolean);return v.length?`<tr><td>${e}<td>${v[0]}<td>${v[v.length-1]}</tr>`:""}).join("")}</table></details>`;return h}
const c=S.cur;
if(!c)return h+`<div class=card><b>Elige la rutina</b><div class=chips>${Object.keys(W).map(k=>`<button class=chip data-st=${k}>${W[k][0]}</button>`).join("")}</div><p class=mut>Cuerpo completo ×3, 60-75 min. Calienta 8-10 min. Progresión: con 1-2 repeticiones en reserva, sube un 2,5-5% el peso al llegar al tope del rango en todas las series. Cada 6 semanas, descarga.</p></div>`;
h+=`<p class=mut>${W[c.k][0]} · ${c.d}</p>`;
W[c.k][1].forEach(([e,sr])=>{const rg=sr.split("×")[1]||"",up=parseInt(rg.split("-").pop()),pv=last(e),rows=c.ex[e]||[];
h+=`<div class=card><b>${e}</b><div class=mut>${sr}${up&&!/s$/.test(sr)?" reps":""} · RIR 2 · descanso ${rs(e)==150?"2:30":"1:30"}</div>${pv?`<div class=mut>Última vez: ${pv} kg</div>`:`<div class=hint>Primera vez: elige un peso con el que hagas ${up&&!/s$/.test(sr)?up:10} reps dejando 4 en reserva.</div>`}<table><tr><th>#<th>KG<th>REPS<th></tr>${rows.map((r,i)=>`<tr><td>${i+1}<td><input type=number step=.5 inputmode=decimal data-k="${e}|${i}|0" value="${r[0]}" placeholder="${pv||""}"><td><input type=number inputmode=numeric data-k="${e}|${i}|1" value="${r[1]}" placeholder="${rg}"><td><button class="ck${r[2]?" on":""}" data-ck="${e}|${i}">✓</button></tr>`).join("")}</table><button class=chip data-ad="${e}|1">+ serie</button> <button class=chip data-ad="${e}|-1">− serie</button></div>`});
return h+`<p><button data-a=fin>Terminar sesión</button> <button class=chip data-a=can>Cancelar</button></p>`}
const ws=()=>S.prog.filter(e=>e.w&&e.d).map(e=>[new Date(e.d).getTime(),+e.w]).sort((a,b)=>a[0]-b[0]);
const av=(a,t0,t1)=>{const x=a.filter(p=>p[0]>t0&&p[0]<=t1).map(p=>p[1]);return x.length?x.reduce((u,v)=>u+v)/x.length:null};
function chart(a){const W0=320,H0=150;if(a.length<2)return`<p class=mut>Añade al menos 2 pesajes para ver la gráfica.</p>`;const l=a[a.length-1][0],p=a.filter(q=>q[0]>=l-RG*864e5);if(p.length<2)return`<p class=mut>Pocos datos en este rango.</p>`;
const t0=p[0][0],t1=p[p.length-1][0],ys=p.map(q=>q[1]),lo=Math.min(...ys)-1,hi=Math.max(...ys)+1,X=t=>10+(t-t0)/(t1-t0||1)*(W0-20),Y=v=>H0-10-(v-lo)/(hi-lo)*(H0-20),L=f=>p.map(q=>X(q[0]).toFixed(1)+","+Y(f(q)).toFixed(1)).join(" ");
return`<svg viewBox="0 0 ${W0} ${H0}" style="width:100%"><polyline points="${L(q=>q[1])}" fill="none" stroke="currentColor" stroke-opacity=".4" stroke-width="1.5"/><polyline points="${L(q=>av(a,q[0]-7*864e5,q[0]))}" fill="none" stroke="var(--accent)" stroke-width="2.5"/><text x="4" y="12" font-size="10" fill="currentColor">${hi.toFixed(0)}</text><text x="4" y="${H0-2}" font-size="10" fill="currentColor">${lo.toFixed(0)}</text></svg>`}

else if(s=="m")h+=`<div class=card><div class=g><div><label>Fecha</label><input id=md type=date value="${today()}"></div><div><label>Cintura (cm)</label><input id=mc type=number step=.5 inputmode=decimal></div><div><label>Pasos</label><input id=mp type=number inputmode=numeric></div><div><label>Sueño (h)</label><input id=ms type=number step=.5 inputmode=decimal></div><div><label>Energía (1-5)</label><input id=me type=number min=1 max=5></div><div><label>Dieta cumplida (%)</label><input id=ma type=number min=0 max=100></div></div><p><button data-a=addm>Guardar</button> <button class=chip data-a=delm>Borrar el último</button></p><p class=mut>Cintura a la altura del ombligo, 1 vez por semana. Fotos cada 2 semanas.</p></div><div class="card wrap"><table><tr><th>Fecha<th>cm<th>Pasos<th>Sueño<th>Energía<th>%</tr>${S.prog.filter(e=>!e.w).slice(-14).reverse().map(e=>`<tr><td>${e.d}<td>${e.c}<td>${e.p}<td>${e.s}<td>${e.e}<td>${e.a}</tr>`).join("")}</table></div>`;
else h+=`<div class=card><b>Revisión semanal</b><ol><li>¿Cómo evolucionaron la media de peso y la cintura?</li><li>¿Subí cargas en los básicos?</li><li>¿Cumplí al menos el 80% de la dieta y los pasos?</li><li>¿Cómo estuvieron el sueño y la energía?</li><li>¿Qué único ajuste hago la semana que viene?</li></ol></div>`;
return h}
function vA(){const s=S.set,k=SUB.a,th=TH[thn()];let h=`<h2>Ajustes</h2>${ch("a",[["c","Colores"],["e","Estilo"],["p","Perfil"]])}`;

if(k=="c")h+=`<div class=card><b>Temas</b><div class=g>${Object.keys(TH).map(n=>`<button class=th data-th="${n}" style="background:${TH[n][0]};color:${TH[n][1]};border:2px solid ${thn()==n?TH[n][2]:"transparent"}"><i style="background:${TH[n][2]}"></i>${n}</button>`).join("")}</div></div><div class=card><b>Colores propios</b><label>Acento</label><input type=color data-s=acc value="${s.acc||th[2]}"><label>Texto</label><input type=color data-s=fg value="${s.fg||th[1]}"></div>`;
else if(k=="e")h+=`<div class=card>${r("op","Translucidez de tarjetas",0,1,.02,th[3])}${r("bl","Desenfoque",0,24,1,12)}${r("r","Redondeo de bordes",0,28,1,14)}${r("fs","Tamaño de letra",13,20,1,15)}<label>Fuente</label><select data-s=ff>${Object.keys(FF).map(n=>`<option${(s.ff||"Mono")==n?" selected":""}>${n}</option>`).join("")}</select><p><button data-a=reset>Restablecer estilo</button></p></div>`;
else h+=`<div class=card><label>Primer día del plan</label><input type=date data-sd value="${S.start}"></div><details><summary>Copia de seguridad</summary><textarea id=bk rows=6 style="width:100%">${JSON.stringify(S).replace(/</g,"&lt;")}</textarea><p><button data-a=imp>Importar</button></p><p class=mut>Copia este texto para guardar tus datos o pégalo en otro dispositivo.</p></details>`;

function ap(){const s=S.set,th=TH[thn()],r=document.documentElement,x=r.style;r.dataset.theme=th[5];x.colorScheme=th[5];
x.setProperty("--bg",th[0]);x.setProperty("--fg",s.fg||th[1]);x.setProperty("--accent",s.acc||th[2]);x.setProperty("--on",th[4]);x.setProperty("--op",s.op??th[3]);x.setProperty("--bl",(s.bl??12)+"px");x.setProperty("--r",(s.r??14)+"px");x.setProperty("--fs",(s.fs??15)+"px");x.setProperty("--ff",FF[s.ff||"Mono"])}
function R(){ap();$("#v").innerHTML={h:vH,d:vD,e:vE,r:vR,p:vP,a:vA}[T]();document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t==T))}
document.addEventListener("change",e=>{const t=e.target,d=t.dataset;
if(d.k){const[n,i,j]=d.k.split("|");S.cur.ex[n][i][j]=t.value;save();return}
if(d.m)S.meals[d.m]=t.value;
else if("wk" in d)S.w=+t.value;
else if(d.sh!=null)S.shop[d.sh]=t.checked;
else if("q" in d)Q=t.value;
else if(d.s)S.set[d.s]=t.type=="range"?+t.value:t.value;
else if("sd" in d)S.start=t.value;
else return;
save();R()});
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset,g=k=>$("#"+k).value;
if("rt" in d){if(d.rt=="0"){RT=0;tick()}else rest(RT+30);return}
if(d.t){T=d.t;scrollTo(0,0)}
else if(d.sub){const[k,v]=d.sub.split("|");SUB[k]=v}
else if(d.go){const[k,v]=d.go.split("|");T=k;SUB[k]=v}
else if(d.day)DAY=+d.day;
else if(d.info)INFO[d.info]=!INFO[d.info];
else if(d.fl!=null)FL=d.fl;
else if(d.rg)RG=+d.rg;
else if(d.th){S.set.th=d.th;delete S.set.acc;delete S.set.fg;delete S.set.op}
else if(d.st){S.cur={k:d.st,d:today(),ex:{}};W[d.st][1].forEach(([n,sr])=>S.cur.ex[n]=Array.from({length:parseInt(sr)||3},()=>["","",false]))}
else if(d.ck){const[n,i]=d.ck.split("|"),r=S.cur.ex[n][i];r[2]=!r[2];if(r[2])rest(rs(n))}
else if(d.ad){const[n,v]=d.ad.split("|"),a=S.cur.ex[n];+v>0?a.push(["","",false]):a.length>1&&a.pop()}
else if(d.fb)(S.run[S.w]=S.run[S.w]||{}).fb=+d.fb;
else if(d.a=="fin"){S.hist.push({d:S.cur.d,k:S.cur.k,ex:S.cur.ex});S.cur=null;RT=0;tick()}
else if(d.a=="can")S.cur=null;
else if(d.a=="addw"){const v=g("wv");if(!v)return;S.prog=S.prog.filter(x=>!(x.w&&x.d==g("wd")));S.prog.push({d:g("wd"),w:v})}
else if(d.a=="addm")S.prog.push({d:g("md"),c:g("mc"),p:g("mp"),s:g("ms"),e:g("me"),a:g("ma")});

else return;
save();R()});
R();
